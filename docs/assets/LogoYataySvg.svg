<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#327c8c" />
      <stop offset="100%" stop-color="#1b525e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4bb0c4" />
      <stop offset="100%" stop-color="#78cce0" />
    </linearGradient>
  </defs>

  <!-- Dental Icon / Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield / Tooth Base -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#brandGrad)" />
    
    <!-- Stylized Tooth Path inside -->
    <path d="M35 18C28 18 21 21 21 28C21 34 23 39 25 45C27 51 28 55 31 55C33 55 33 50 35 44C37 50 37 55 39 55C42 55 43 51 45 45C47 39 49 34 49 28C49 21 42 18 35 18Z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Sparkle / Modern Star in top right -->
    <path d="M50 14L51.8 19.2L57 21L51.8 22.8L50 28L48.2 22.8L43 21L48.2 19.2Z" fill="url(#accentGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(96, 44)">
    <!-- NOVA -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Nova</text>
    <!-- DENT -->
    <text x="82" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#327c8c" letter-spacing="-0.5">Dent</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(98, 64)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2.8">AĞIZ VE DİŞ SAĞLIĞI POLİKLİNİĞİ</text>
  </g>
</svg>
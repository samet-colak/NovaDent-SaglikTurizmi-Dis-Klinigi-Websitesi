        },

          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Invisalign tedavisi vakanın çapraşıklık durumuna bağlı olarak genellikle 6 ile 18 ay arasında tamamlanır. Dışarıdan bakıldığında görünmeyen şeffaf plaklar genç ve yetişkin tüm hastalara uygundur. 3D ağız içi tarayıcılarımızla tedavinin sonucunu henüz başlamadan önce simülasyon olarak görebilirsiniz."
          }
        },

          "@type": "Question",

          "acceptedAnswer": {

          }
        },

          }
